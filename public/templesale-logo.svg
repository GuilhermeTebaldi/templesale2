<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <defs>
    <!-- Filter for soft subtle 3D drop shadow -->
    <filter id="tile-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="2" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.28" />
    </filter>

    <!-- Large Yellow Tile Gradients -->
    <linearGradient id="yellow-base-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="18%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#facc15" />
      <stop offset="85%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <linearGradient id="yellow-inner-grad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="40%" stop-color="#fde047" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Top Amber Tile Gradients -->
    <linearGradient id="amber-base-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="65%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Green Tile Gradients -->
    <linearGradient id="green-base-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dcfce7" />
      <stop offset="20%" stop-color="#bbf7d0" />
      <stop offset="55%" stop-color="#4ade80" />
      <stop offset="85%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>

    <linearGradient id="green-inner-grad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- White Gloss Gradients -->
    <linearGradient id="gloss-white-grad" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <!-- 1. TOP AMBER TILE -->
  <g transform="translate(290, 160) rotate(14) translate(-46, -46)" filter="url(#tile-shadow)">
    <!-- Base Outer Border/Bezel -->
    <rect x="0" y="0" width="92" height="92" rx="18" fill="url(#amber-base-grad)" stroke="#9a3412" stroke-width="4.5" stroke-linejoin="round" />
    <!-- Inner Glossy Body -->
    <rect x="5.5" y="5.5" width="81" height="81" rx="14" fill="url(#amber-base-grad)" />
    <!-- Bottom-right deep reflection -->
    <path d="M 20 86.5 L 72 86.5 A 14 14 0 0 0 86.5 72 L 86.5 35 Z" fill="#b45309" opacity="0.35" />
    <!-- Top-left Bright Gloss -->
    <path d="M 8 30 A 14 14 0 0 1 30 8 L 55 8 C 30 20 18 36 8 62 Z" fill="url(#gloss-white-grad)" />
    <!-- Top Edge Highlight line -->
    <path d="M 16 11 Q 46 8 76 11" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- 2. MAIN LARGE GOLDEN YELLOW TILE -->
  <g transform="translate(200, 270) rotate(-11) translate(-75, -75)" filter="url(#tile-shadow)">
    <!-- Outer Border / Bevel -->
    <rect x="0" y="0" width="150" height="150" rx="26" fill="url(#yellow-base-grad)" stroke="#c2410c" stroke-width="6.5" stroke-linejoin="round" />
    <!-- Inner Base -->
    <rect x="8" y="8" width="134" height="134" rx="20" fill="url(#yellow-inner-grad)" />
    <!-- Bottom Right Bevel Shadow -->
    <path d="M 35 142 L 124 142 A 20 20 0 0 0 142 124 L 142 50 Z" fill="#b45309" opacity="0.45" />
    <!-- Bottom-right interior curve -->
    <path d="M 60 134 Q 134 134 134 60" stroke="#78350f" stroke-width="3" fill="none" opacity="0.25" />
    <!-- Top-Left Large Gloss Reflection -->
    <path d="M 12 50 A 20 20 0 0 1 50 12 L 95 12 C 55 30 30 60 12 110 Z" fill="url(#gloss-white-grad)" />
    <!-- White Crisp Top-Left Arc Highlight -->
    <path d="M 22 18 Q 75 14 128 18" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />
    <path d="M 18 24 Q 14 75 18 120" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.75" />
  </g>

  <!-- 3. RIGHT GREEN TILE -->
  <g transform="translate(345, 235) rotate(-10) translate(-46, -46)" filter="url(#tile-shadow)">
    <!-- Outer Border/Bezel -->
    <rect x="0" y="0" width="92" height="92" rx="18" fill="url(#green-base-grad)" stroke="#14532d" stroke-width="5" stroke-linejoin="round" />
    <!-- Inner Body -->
    <rect x="6" y="6" width="80" height="80" rx="14" fill="url(#green-inner-grad)" />
    <!-- Bottom-Right Dark Shadow -->
    <path d="M 20 86 L 72 86 A 14 14 0 0 0 86 72 L 86 35 Z" fill="#052e16" opacity="0.4" />
    <!-- Top-Left Gloss -->
    <path d="M 8 32 A 14 14 0 0 1 32 8 L 56 8 C 30 20 20 38 8 60 Z" fill="url(#gloss-white-grad)" />
    <!-- Top Edge Highlight -->
    <path d="M 16 11 Q 46 8 76 11" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
    <path d="M 11 18 Q 8 46 11 72" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.65" />
  </g>
</svg>
