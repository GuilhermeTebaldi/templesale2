name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: templesale_test
          POSTGRES_PASSWORD: templesale_test
          POSTGRES_DB: templesale_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U templesale_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DISCOVERY_TEST_DATABASE_URL: postgres://templesale_test:templesale_test@127.0.0.1:5432/templesale_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Startup recovery regression tests
        run: node --test tests/startup.test.mjs

      - name: Notification regression tests
        run: node --experimental-sqlite --import tsx --test tests/notifications.test.mjs tests/business-taxonomy.test.mjs tests/admin-establishment.test.mjs

      - name: Local discovery regression tests
        run: node --import tsx --test tests/discovery.test.mjs tests/publication-feed.test.mjs tests/admin-session.test.mjs tests/whatsapp-contact.test.mjs

      - name: Map marker layout regression tests
        run: node --import tsx --test tests/map-marker-layout.test.mjs

      - name: Terms acceptance and identity tests
        run: node --experimental-sqlite --import tsx --test tests/legal.test.mjs tests/account-archive.test.mjs

      - name: Comment delivery and write admission tests
        run: node --import tsx --test tests/comment-delivery.test.ts tests/write-admission.test.ts tests/write-operation.test.ts

      - name: Publication trash and ownership tests
        run: node --import tsx --test tests/publication-trash.test.mjs

      - name: Build
        run: npm run build

      - name: Mobile navigation browser regressions
        run: |
          npm install --prefix "$RUNNER_TEMP/templesale-browser-check" --no-save --package-lock=false playwright@1.51.1
          "$RUNNER_TEMP/templesale-browser-check/node_modules/.bin/playwright" install --with-deps --only-shell chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/templesale-browser-check/node_modules/playwright/index.mjs" node --test tests/mobile-navigation.browser.mjs
